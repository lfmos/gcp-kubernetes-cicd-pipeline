stages:
  - validate
  - build
  - deploy

variables:
  IMAGE_NAME: gke-cicd-showcase
  GKE_CLUSTER: portfolio-cluster
  GCP_REGION: us-central1
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

validate_project:
  stage: validate
  image: alpine:3.22
  script:
    - test -f Dockerfile
    - test -f app/index.html
    - test -f k8s/deployment.yaml
    - test -f k8s/service.yaml
    - test -f k8s/hpa.yaml
    - grep -q "IMAGE_PLACEHOLDER" k8s/deployment.yaml
    - echo "Estrutura e manifests validados."

build_and_publish:
  stage: build
  image: docker:cli
  identity: google_cloud
  services:
    - name: docker:dind
  before_script:
    - apk add --no-cache wget tar
    - wget -q "https://github.com/GoogleCloudPlatform/docker-credential-gcr/releases/download/v2.1.22/docker-credential-gcr_linux_amd64-2.1.22.tar.gz" -O - | tar xz -C /tmp
    - chmod +x /tmp/docker-credential-gcr
    - mv /tmp/docker-credential-gcr /usr/local/bin/
    - docker-credential-gcr configure-docker --registries="${GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_LOCATION}-docker.pkg.dev"
  script:
    - export IMAGE_REPOSITORY="${GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_LOCATION}-docker.pkg.dev/${GOOGLE_ARTIFACT_REGISTRY_PROJECT_ID}/${GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_NAME}/${IMAGE_NAME}"
    - export IMAGE_SHA="${IMAGE_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - docker build --pull --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "${IMAGE_SHA}" .
    - docker push "${IMAGE_SHA}"
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        docker tag "${IMAGE_SHA}" "${IMAGE_REPOSITORY}:latest"
        docker push "${IMAGE_REPOSITORY}:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH

deploy_to_gke:
  stage: deploy
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  identity: google_cloud
  before_script:
    - apt-get update
    - CLOUDSDK_SKIP_PY_COMPILATION=1 apt-get install -y --no-install-recommends kubectl google-cloud-cli-gke-gcloud-auth-plugin
    - rm -rf /var/lib/apt/lists/*
  script:
    - export IMAGE_URI="${GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_LOCATION}-docker.pkg.dev/${GOOGLE_ARTIFACT_REGISTRY_PROJECT_ID}/${GOOGLE_ARTIFACT_REGISTRY_REPOSITORY_NAME}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - gcloud config set project "${GOOGLE_ARTIFACT_REGISTRY_PROJECT_ID}"
    - gcloud container clusters get-credentials "${GKE_CLUSTER}" --region "${GCP_REGION}"
    - sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" k8s/deployment.yaml > /tmp/deployment.yaml
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f /tmp/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/hpa.yaml
    - kubectl apply -f k8s/pdb.yaml
    - kubectl rollout status deployment/gke-cicd-showcase -n lf-labs --timeout=180s
    - kubectl get deployment,pods,service,hpa -n lf-labs
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
