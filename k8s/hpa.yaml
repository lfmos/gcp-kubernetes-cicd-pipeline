apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gke-cicd-showcase
  namespace: lf-labs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gke-cicd-showcase
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
