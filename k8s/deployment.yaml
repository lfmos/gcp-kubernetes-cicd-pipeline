apiVersion: apps/v1
kind: Deployment

metadata:
  name: gke-cicd-showcase
  namespace: lf-labs

  labels:
    app.kubernetes.io/name: gke-cicd-showcase
    app.kubernetes.io/part-of: gke-cicd-showcase

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: gke-cicd-showcase

  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-cicd-showcase
        app.kubernetes.io/part-of: gke-cicd-showcase

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101

        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web

          image: IMAGE_PLACEHOLDER

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /healthz
              port: http

            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http

            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 32Mi

            limits:
              cpu: 250m
              memory: 128Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: cache
              mountPath: /var/cache/nginx

            - name: run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir: {}

        - name: cache
          emptyDir: {}

        - name: run
          emptyDir: {}